    <script type="text/babel">

        const { useState, useEffect, useRef, useCallback } = React;

        // Custom Hooks
        const useIntersectionObserver = (options) => {
            const [elements, setElements] = useState([]);
            const [entries, setEntries] = useState([]);
            const observer = useRef(null);

            useEffect(() => {
                if (elements.length > 0) {
                    observer.current = new IntersectionObserver((observedEntries) => {
                        setEntries(observedEntries);
                    }, options);
                    elements.forEach(element => {
                        if (element) observer.current.observe(element);
                    });
                }
                return () => {
                    if (observer.current) observer.current.disconnect();
                };
            }, [elements, options]);

            useEffect(() => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('visible');
                });
            }, [entries]);

            return setElements;
        };

        const useTypingEffect = (text, speed = 100, delay = 0) => {
            const [displayedText, setDisplayedText] = useState('');
            const [isTyping, setIsTyping] = useState(false);

            useEffect(() => {
                const timeout = setTimeout(() => {
                    setIsTyping(true);
                    let i = 0;
                    const interval = setInterval(() => {
                        if (i < text.length) {
                            setDisplayedText(text.slice(0, i + 1));
                            i++;
                        } else {
                            clearInterval(interval);
                            setIsTyping(false);
                        }
                    }, speed);
                    return () => clearInterval(interval);
                }, delay);
                return () => clearTimeout(timeout);
            }, [text, speed, delay]);

            return { displayedText, isTyping };
        };

        // Three.js Background
        const ThreeBackground = () => {
            const canvasRef = useRef(null);
            const mouseRef = useRef({ x: 0, y: 0 });
            const frameRef = useRef(0);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;

                const isMobile = window.matchMedia('(pointer: coarse)').matches;
                if (isMobile) {
                    canvas.style.display = 'none';
                    return;
                }

                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

                const particlesGeometry = new THREE.BufferGeometry();
                const particlesCount = 800;
                const posArray = new Float32Array(particlesCount * 3);
                const velocityArray = new Float32Array(particlesCount * 3);

                for (let i = 0; i < particlesCount * 3; i += 3) {
                    posArray[i] = (Math.random() - 0.5) * 50;
                    posArray[i + 1] = (Math.random() - 0.5) * 50;
                    posArray[i + 2] = (Math.random() - 0.5) * 50;
                    velocityArray[i] = (Math.random() - 0.5) * 0.01;
                    velocityArray[i + 1] = (Math.random() - 0.5) * 0.01;
                    velocityArray[i + 2] = (Math.random() - 0.5) * 0.01;
                }

                particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

                const particlesMaterial = new THREE.PointsMaterial({
                    size: 0.05,
                    color: 0xffffff,
                    transparent: true,
                    opacity: 0.6,
                    blending: THREE.AdditiveBlending,
                });

                const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
                scene.add(particlesMesh);

                const geometries = [
                    new THREE.IcosahedronGeometry(0.5, 0),
                    new THREE.OctahedronGeometry(0.4, 0),
                    new THREE.TetrahedronGeometry(0.3, 0),
                ];

                const shapes = [];
                for (let i = 0; i < 15; i++) {
                    const geometry = geometries[Math.floor(Math.random() * geometries.length)];
                    const material = new THREE.MeshBasicMaterial({
                        color: 0xffffff,
                        wireframe: true,
                        transparent: true,
                        opacity: 0.1,
                    });
                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.position.set(
                        (Math.random() - 0.5) * 30,
                        (Math.random() - 0.5) * 30,
                        (Math.random() - 0.5) * 20 - 10
                    );
                    mesh.userData = {
                        rotationSpeed: {
                            x: (Math.random() - 0.5) * 0.01,
                            y: (Math.random() - 0.5) * 0.01,
                            z: (Math.random() - 0.5) * 0.01,
                        },
                        floatSpeed: Math.random() * 0.5 + 0.5,
                        floatOffset: Math.random() * Math.PI * 2,
                    };
                    scene.add(mesh);
                    shapes.push(mesh);
                }

                camera.position.z = 15;

                const handleMouseMove = (e) => {
                    mouseRef.current.x = (e.clientX / window.innerWidth) * 2 - 1;
                    mouseRef.current.y = -(e.clientY / window.innerHeight) * 2 + 1;
                };

                window.addEventListener('mousemove', handleMouseMove);

                let animationId;
                const animate = () => {
                    animationId = requestAnimationFrame(animate);
                    frameRef.current++;
                    const time = frameRef.current * 0.01;

                    const positions = particlesGeometry.attributes.position.array;
                    for (let i = 0; i < particlesCount * 3; i += 3) {
                        positions[i] += velocityArray[i] + Math.sin(time + i) * 0.002;
                        positions[i + 1] += velocityArray[i + 1] + Math.cos(time + i) * 0.002;
                        positions[i + 2] += velocityArray[i + 2];
                        if (Math.abs(positions[i]) > 25) velocityArray[i] *= -1;
                        if (Math.abs(positions[i + 1]) > 25) velocityArray[i + 1] *= -1;
                        if (Math.abs(positions[i + 2]) > 25) velocityArray[i + 2] *= -1;
                    }
                    particlesGeometry.attributes.position.needsUpdate = true;

                    particlesMesh.rotation.x += (mouseRef.current.y * 0.1 - particlesMesh.rotation.x) * 0.02;
                    particlesMesh.rotation.y += (mouseRef.current.x * 0.1 - particlesMesh.rotation.y) * 0.02;

                    shapes.forEach((shape) => {
                        shape.rotation.x += shape.userData.rotationSpeed.x;
                        shape.rotation.y += shape.userData.rotationSpeed.y;
                        shape.rotation.z += shape.userData.rotationSpeed.z;
                        shape.position.y += Math.sin(time * shape.userData.floatSpeed + shape.userData.floatOffset) * 0.01;
                    });

                    renderer.render(scene, camera);
                };

                animate();

                const handleResize = () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                };

                window.addEventListener('resize', handleResize);

                return () => {
                    cancelAnimationFrame(animationId);
                    window.removeEventListener('mousemove', handleMouseMove);
                    window.removeEventListener('resize', handleResize);
                    renderer.dispose();
                };
            }, []);

            return <canvas ref={canvasRef} id="three-canvas" />;
        };

        // Particle Field for Hero
        const ParticleField = () => {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;

                const ctx = canvas.getContext('2d');
                let animationId;
                let particles = [];
                const particleCount = 100;
                const connectionDistance = 150;
                const mouseRadius = 200;
                let mouse = { x: null, y: null };

                const resize = () => {
                    canvas.width = canvas.offsetWidth;
                    canvas.height = canvas.offsetHeight;
                };
                resize();
                window.addEventListener('resize', resize);

                class Particle {
                    constructor() {
                        this.x = Math.random() * canvas.width;
                        this.y = Math.random() * canvas.height;
                        this.vx = (Math.random() - 0.5) * 0.5;
                        this.vy = (Math.random() - 0.5) * 0.5;
                        this.radius = Math.random() * 2 + 1;
                        this.opacity = Math.random() * 0.5 + 0.2;
                    }
                    update() {
                        this.x += this.vx;
                        this.y += this.vy;
                        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

                        if (mouse.x !== null && mouse.y !== null) {
                            const dx = mouse.x - this.x;
                            const dy = mouse.y - this.y;
                            const distance = Math.sqrt(dx * dx + dy * dy);
                            if (distance < mouseRadius) {
                                const force = (mouseRadius - distance) / mouseRadius;
                                this.vx -= (dx / distance) * force * 0.02;
                                this.vy -= (dy / distance) * force * 0.02;
                            }
                        }
                    }
                    draw() {
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                        ctx.fill();
                    }
                }

                for (let i = 0; i < particleCount; i++) particles.push(new Particle());

                const handleMouseMove = (e) => {
                    const rect = canvas.getBoundingClientRect();
                    mouse.x = e.clientX - rect.left;
                    mouse.y = e.clientY - rect.top;
                };
                const handleMouseLeave = () => { mouse.x = null; mouse.y = null; };

                canvas.addEventListener('mousemove', handleMouseMove);
                canvas.addEventListener('mouseleave', handleMouseLeave);

                const animate = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    particles.forEach(particle => { particle.update(); particle.draw(); });

                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            const dx = particles[i].x - particles[j].x;
                            const dy = particles[i].y - particles[j].y;
                            const distance = Math.sqrt(dx * dx + dy * dy);
                            if (distance < connectionDistance) {
                                ctx.beginPath();
                                ctx.moveTo(particles[i].x, particles[i].y);
                                ctx.lineTo(particles[j].x, particles[j].y);
                                ctx.strokeStyle = `rgba(255, 255, 255, ${0.1 * (1 - distance / connectionDistance)})`;
                                ctx.lineWidth = 0.5;
                                ctx.stroke();
                            }
                        }
                    }
                    animationId = requestAnimationFrame(animate);
                };
                animate();

                return () => {
                    cancelAnimationFrame(animationId);
                    window.removeEventListener('resize', resize);
                    canvas.removeEventListener('mousemove', handleMouseMove);
                    canvas.removeEventListener('mouseleave', handleMouseLeave);
                };
            }, []);

            return <canvas ref={canvasRef} style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: '100%' }} />;
        };

        // Icons
        const GithubIcon = ({ className = "" }) => (

            </svg>

        const LinkedinIcon = ({ className = "" }) => (

                <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>

        const ExternalLinkIcon = ({ className = "" }) => (

                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                <polyline points="15 3 21 3 21 9"></polyline>

        const AwardIcon = ({ className = "" }) => (

                <circle cx="12" cy="8" r="7"></circle>

        const MailIcon = ({ className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>

                const ring = document.getElementById('cursor-ring');
                if (!dot || !ring) return;
                if (window.matchMedia('(pointer: coarse)').matches) return;

                let mouseX = 0, mouseY = 0;
                let ringX = 0, ringY = 0;

                const handleMouseMove = (e) => {
                    mouseX = e.clientX;
                    mouseY = e.clientY;
                    dot.style.left = mouseX + 'px';
                    dot.style.top = mouseY + 'px';
                };

                const animateRing = () => {
                    ringX += (mouseX - ringX) * 0.15;
                    ringY += (mouseY - ringY) * 0.15;
                    ring.style.left = ringX + 'px';
                    ring.style.top = ringY + 'px';
                    requestAnimationFrame(animateRing);
                };

                const handleMouseOver = (e) => {
                    if (e.target.closest('a, button, [role="button"], input, textarea, .magnetic-btn, .glass-card')) {
                        document.body.classList.add('cursor-hover');
                    }
                };
                const handleMouseOut = (e) => {
                    if (e.target.closest('a, button, [role="button"], input, textarea, .magnetic-btn, .glass-card')) {
                        document.body.classList.remove('cursor-hover');
                    }
                };

                window.addEventListener('mousemove', handleMouseMove);
                document.addEventListener('mouseover', handleMouseOver);
                document.addEventListener('mouseout', handleMouseOut);
                animateRing();

                return () => {
                    window.removeEventListener('mousemove', handleMouseMove);

                { title: "IOT Presentation", issuer: "Sacred Heart College (SHINE '24)" },
                { title: "Paper Publication - 5G/Next Gen Networks", issuer: "IJATEM Journal, November 2024" },
                { title: "Paper Presentation", issuer: "International Conference on 'Generative Technologies'" },
                { title: "Paper Presentation", issuer: "International Conference on 'Next-Gen Computing'" },
                { title: "Hackathon Participant - AI to GLOW", issuer: "VIT Bangalore & ICER" },
                { title: "Hackathon Participant - OpenHack 2025", issuer: "Indian Institute of Science (IISc), Bangalore" },
                { title: "Hackathon Participant - K! Hacks 2.0", issuer: "Anna University" },
                { title: "Agentic AI Day Participant", issuer: "Google Cloud & Hack2skill" },
            ];

            useEffect(() => {
                if (sectionRef.current) setRefs(sectionRef.current);
            }, [setRefs]);

            return (
                <section id="certifications" ref={sectionRef} className="py-24 reveal relative">
                    <div className="container mx-auto px-6">
                        <div className="text-center mb-16">
                            <span className="text-sm text-gray-500 uppercase tracking-widest">Achievements</span>
                            <h2 className="text-3xl md:text-5xl font-bold text-white mt-2 mb-4">Certifications & Awards</h2>
                            <div className="w-24 h-px bg-gradient-to-r from-transparent via-white/30 to-transparent mx-auto"></div>
                        </div>

                        <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-6 max-w-7xl mx-auto stagger-children">
                            {certData.map((cert, index) => (
                                <div key={index} className="glass-card rounded-2xl p-6 flex flex-col items-center text-center group hover:scale-105 transition-all duration-300">
                                    <div className="w-16 h-16 rounded-2xl bg-white/5 flex items-center justify-center mb-4 group-hover:bg-white/10 transition-colors">
                                        <AwardIcon className="text-white/80 group-hover:text-white transition-colors" />
                                    </div>
                                    <h3 className="text-lg font-bold text-white mt-2 mb-1">{cert.title}</h3>
                                    <p className="text-gray-400 text-sm">{cert.issuer}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        // Contact Section
        const Contact = ({ setRefs }) => {
            const sectionRef = useRef(null);
            const [status, setStatus] = useState("");
            const [formData, setFormData] = useState({ name: '', email: '', message: '' });

            useEffect(() => {
                if (sectionRef.current) setRefs(sectionRef.current);
            }, [setRefs]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setStatus("sending");
                const form = e.target;
                const data = new FormData(form);

                try {
                    const response = await fetch(form.action, {
                        method: form.method,
                        body: data,
                        headers: { 'Accept': 'application/json' }
                    });

                    if (response.ok) {
                        setStatus("success");
                        setFormData({ name: '', email: '', message: '' });
                        form.reset();
                    } else {
                        const responseData = await response.json();
                        if (responseData.errors) {
                            setStatus(responseData.errors.map(error => error.message).join(", "));
                        } else {
                            setStatus("Oops! There was a problem submitting your form");
                        }
                    }
                } catch (error) {
                    setStatus("Oops! There was a problem submitting your form");
                }
            };

            const handleChange = (e) => {
                setFormData({ ...formData, [e.target.name]: e.target.value });
            };

            return (
                <section id="contact" ref={sectionRef} className="py-24 reveal relative">
                    <div className="container mx-auto px-6">
                        <div className="text-center mb-16">
                            <span className="text-sm text-gray-500 uppercase tracking-widest">Lets connect</span>
                            <h2 className="text-3xl md:text-5xl font-bold text-white mt-2 mb-4">Get In Touch</h2>
                            <div className="w-24 h-px bg-gradient-to-r from-transparent via-white/30 to-transparent mx-auto"></div>
                        </div>

                        <div className="max-w-4xl mx-auto">
                            <div className="grid md:grid-cols-2 gap-12">
                                <div className="space-y-8">
                                    <div>
                                        <h3 className="text-2xl font-bold text-white mb-4">Lets work together</h3>
                                        <p className="text-gray-400 leading-relaxed">
                                            I am currently open to new opportunities and collaborations. Feel free to reach out via email or connect with me on social media. I am always excited to discuss new projects and ideas.
                                        </p>
                                    </div>

                                    <div className="space-y-4">
                                        <a href="mailto:harishthiyagu02@gmail.com" className="flex items-center gap-4 glass-card p-4 rounded-xl hover:bg-white/5 transition-all group magnetic-btn">
                                            <div className="w-12 h-12 rounded-full bg-white/5 flex items-center justify-center group-hover:bg-white/10 transition-colors">
                                                <MailIcon className="w-5 h-5 text-white" />
                                            </div>
                                            <div>
                                                <div className="text-sm text-gray-500">Email</div>
                                                <div className="text-white font-medium">harishthiyagu02@gmail.com</div>
                                            </div>
                                        </a>

                                        <a href="https://github.com/Hari022002" target="_blank" rel="noopener noreferrer" className="flex items-center gap-4 glass-card p-4 rounded-xl hover:bg-white/5 transition-all group magnetic-btn">
                                            <div className="w-12 h-12 rounded-full bg-white/5 flex items-center justify-center group-hover:bg-white/10 transition-colors">
                                                <GithubIcon className="w-5 h-5 text-white" />
                                            </div>
                                            <div>
                                                <div className="text-sm text-gray-500">GitHub</div>
                                                <div className="text-white font-medium">Hari022002</div>
                                            </div>
                                        </a>

                                        <a href="https://linkedin.com/in/harish-t-92064b235" target="_blank" rel="noopener noreferrer" className="flex items-center gap-4 glass-card p-4 rounded-xl hover:bg-white/5 transition-all group magnetic-btn">
                                            <div className="w-12 h-12 rounded-full bg-white/5 flex items-center justify-center group-hover:bg-white/10 transition-colors">
                                                <LinkedinIcon className="w-5 h-5 text-white" />
                                            </div>
                                            <div>
                                                <div className="text-sm text-gray-500">LinkedIn</div>
                                                <div className="text-white font-medium">Harish T</div>
                                            </div>
                                        </a>
                                    </div>
                                </div>

                                <div className="glass-card rounded-2xl p-8">
                                    <form action="https://formspree.io/f/movkwlrd" method="POST" onSubmit={handleSubmit} className="space-y-6">
                                        <div>
                                            <label className="block text-sm text-gray-400 mb-2">Name</label>
                                            <input 
                                                type="text" 
                                                name="name" 
                                                placeholder="Your Name" 
                                                required 
                                                value={formData.name}
                                                onChange={handleChange}
                                                className="w-full bg-black/30 text-white border border-white/10 rounded-xl py-3 px-4 focus:outline-none input-glow transition-all duration-300 placeholder-gray-600"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm text-gray-400 mb-2">Email</label>
                                            <input 
                                                type="email" 
                                                name="email" 
                                                placeholder="Your Email" 
                                                required 
                                                value={formData.email}
                                                onChange={handleChange}
                                                className="w-full bg-black/30 text-white border border-white/10 rounded-xl py-3 px-4 focus:outline-none input-glow transition-all duration-300 placeholder-gray-600"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm text-gray-400 mb-2">Message</label>
                                            <textarea 
                                                name="message" 
                                                placeholder="Your Message" 
                                                rows="5" 
                                                required 
                                                value={formData.message}
                                                onChange={handleChange}
                                                className="w-full bg-black/30 text-white border border-white/10 rounded-xl py-3 px-4 focus:outline-none input-glow transition-all duration-300 placeholder-gray-600 resize-none"
                                            ></textarea>
                                        </div>
                                        <div className="text-center">
                                            <button 
                                                type="submit" 
                                                disabled={status === "sending"} 
                                                className="w-full bg-white text-black font-bold py-3 px-8 rounded-xl shadow-lg hover:shadow-2xl transform hover:-translate-y-1 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed magnetic-btn"
                                            >
                                                {status === "sending" ? "Sending..." : "Send Message"}
                                            </button>
                                        </div>
                                        {status === "success" && <p className="text-center text-green-400 mt-4 text-sm">Thank you for your message! I will get back to you soon.</p>}
                                        {status && status !== "sending" && status !== "success" && <p className="text-center text-red-400 mt-4 text-sm">{status}</p>}
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        // Footer
        const Footer = () => {
            return (
                <footer className="py-8 border-t border-white/5">
                    <div className="container mx-auto px-6">
                        <div className="flex flex-col md:flex-row justify-between items-center gap-4">
                            <div className="text-gray-500 text-sm">
                                <span className="font-semibold text-white">Harish T</span> — Backend Developer
                            </div>
                            <div className="flex items-center gap-6">
                                <a href="https://github.com/Hari022002" target="_blank" rel="noopener noreferrer" className="text-gray-500 hover:text-white transition-colors magnetic-btn" aria-label="GitHub">
                                    <GithubIcon className="w-5 h-5" />
                                </a>
                                <a href="https://linkedin.com/in/harish-t-92064b235" target="_blank" rel="noopener noreferrer" className="text-gray-500 hover:text-white transition-colors magnetic-btn" aria-label="LinkedIn">
                                    <LinkedinIcon className="w-5 h-5" />
                                </a>
                                <a href="mailto:harishthiyagu02@gmail.com" className="text-gray-500 hover:text-white transition-colors magnetic-btn" aria-label="Email">
                                    <MailIcon className="w-5 h-5" />
                                </a>
                            </div>
                            <div className="text-gray-600 text-sm">
                                &copy; {new Date().getFullYear()} All Rights Reserved.
                            </div>
                        </div>
                    </div>
                </footer>
            );
        };

        // Main App
        const App = () => {
            const setElements = useIntersectionObserver({ threshold: 0.1 });
            const elementsRef = useRef([]);

            useEffect(() => {
                const revealElements = document.querySelectorAll('.reveal, .stagger-children');
                elementsRef.current = Array.from(revealElements);
                setElements(elementsRef.current);
            }, [setElements]);

            const addElementRef = (el) => {
                if (el && !elementsRef.current.includes(el)) {
                    elementsRef.current.push(el);
                    setElements([...elementsRef.current]);
                }
            };

            return (
                <div className="bg-neutral-950 text-white min-h-screen">
                    <CustomCursor />
                    <ThreeBackground />
                    <Header />
                    <main className="pt-20">
                        <Hero setRefs={addElementRef} />
                        <About setRefs={addElementRef} />
                        <Projects setRefs={addElementRef} />
                        <Certifications setRefs={addElementRef} />
                        <Contact setRefs={addElementRef} />
                    </main>
                    <Footer />
                </div>
            );
        };

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
